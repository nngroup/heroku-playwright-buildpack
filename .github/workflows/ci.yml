---
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test_ubuntu_22:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
    - run: bash test/run.sh
      env:
        STACK: heroku-22
  test_ubuntu_24:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - run: bash test/run.sh
      env:
        STACK: heroku-24
  test_ubuntu_26:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v5
    - run: bash test/run.sh
      env:
        STACK: heroku-26
